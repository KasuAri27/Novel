choices:
  E18:
    A: { effects: [] }
    B: { effects: [] }
    C: { effects: [] }
  E19:
    A: { effects: [] }
    B: { effects: [] }
    C: { effects: [] }
routes:
  ch04_S0:
    rules:
      - when: "reia.explore >= 2 && hiro.explore >= 2 && meruru.explore >= 2"
        goto: ch04_S-D1
      - when: "reia.explore < 2"
        goto: ch04_S-A1
